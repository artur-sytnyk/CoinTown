<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinTown</title>
    <link rel="icon" type="image/png" href="coin.png" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="canvasWrapper" class="canvas-wrapper">
        <canvas id="canvas"></canvas>
    </div>

    <div class="menu-button">
        ☰
        <div class="menu-content">
            <button id="authBtn">Login</button>
            <button id="saveGameBtn">Save Game</button>
            <button id="restartBtn">Restart</button>
        </div>
    </div>
    <div class="coins-display">
        <span id="coins">0</span> &#x1FA99;
    </div>
    <div class="zoom-controls">
        Zoom: <span id="zoomLevel">1</span>
        <button id="zoomInBtn">+</button>
        <button id="zoomOutBtn">-</button>
    </div>
    <div class="buy-buttons-container">
        <button id="buyResidentBtn" class="green">
            Buy Resident: <span id="rCost">0</span> &#x1FA99;
        </button>
        <button id="buyCommercialBtn" class="blue">
            Buy Commercial: <span id="cCost">0</span> &#x1FA99;
        </button>
        <button id="buyFactoryBtn" class="orange">
            Buy Factory: <span id="fCost">0</span> &#x1FA99;
        </button>
    </div>
    <div class="simulation-control-buttons">
        <button id="startStopBtn">Start</button>
        <button id="simulationSpeedBtn">Speed <span id="speed">x1</span></button>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
